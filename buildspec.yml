version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-south-1"
    ECR_REPOSITORY: "brain-task-app"

phases:
  pre_build:
    commands:
      - echo "Starting pre-build phase"
      - echo "AWS Region is $AWS_DEFAULT_REGION"
      - echo "ECR Repository is $ECR_REPOSITORY"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "AWS Account ID is $AWS_ACCOUNT_ID"
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "ECR Registry is $ECR_REGISTRY"
      - aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region $AWS_DEFAULT_REGION
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - echo "ECR login successful"

  build:
    commands:
      - echo "Starting Docker build"
      - docker build -t brain-task-app .
      - echo "Docker image built successfully"
      - docker tag brain-task-app $ECR_REGISTRY/brain-task-app:latest
      - echo "Docker image tagged successfully"

  post_build:
    commands:
      - echo "Pushing Docker image to ECR"
      - docker push $ECR_REGISTRY/brain-task-app:latest
      - echo "Docker image pushed successfully"