apiVersion: apps/v1
kind: Deployment

metadata:
  name: brain-task-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: brain-task-app

  template:
    metadata:
      labels:
        app: brain-task-app

    spec:
      containers:
        - name: brain-task-app

          image: 874841217466.dkr.ecr.ap-south-1.amazonaws.com/brain-task-app:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"